[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alaamri-msproject-mcp"
version = "0.1.0"
description = "MCP server that lets Claude and other MCP clients drive Microsoft Project desktop on Windows via COM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dr Ibrahim M.A. Alaamri" }]
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
    "pywin32>=306; sys_platform == 'win32'",
]
keywords = ["mcp", "microsoft-project", "ms-project", "scheduling", "planning", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/engibrrahem-wq/alaamri-msproject-mcp"
Author = "https://www.linkedin.com/in/dribrahim-alameri/"

[project.scripts]
alaamri-msproject-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
